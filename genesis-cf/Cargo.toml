# Cloudflare Workers shell for the Safe Genesis Registry service.
#
# Architecture rule (the same as p256-index-cf's):
#   - every decision lives in genesis-rules (compiled to wasm unchanged);
#   - all strongly-consistent state — the sponsored-import queue — lives in
#     ONE Durable Object (SubmitterDo: tasks in SQLite, driven by its alarm);
#   - all reads and CPU work run in the stateless Worker.
#
# Excluded from the root workspace: it only builds for wasm32-unknown-unknown.
#   cargo check --target wasm32-unknown-unknown
#   npx wrangler dev | npx wrangler deploy
[package]
name = "genesis-cf"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
genesis-rules = { path = "../genesis-rules" }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
worker = "0.8"
alloy = { version = "2.2.0", default-features = false, features = [
    "consensus",
    "eips",
    "network",
    "signer-local",
    "sol-types",
    "serde",
] }
k256 = "0.13"
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "rng-getrandom"] }

[profile.release]
opt-level = "s"
lto = true

[workspace]
