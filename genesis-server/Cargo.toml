# Docker shell for the Safe Genesis Registry service: the same API as
# genesis-cf, on Axum, with the import queue in a SQLite file and the
# response cache in memory. One container, one volume — nothing else to run.
# Every decision lives in genesis-rules.
[package]
name = "genesis-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
genesis-rules = { path = "../genesis-rules" }
alloy = { version = "2.2.0", default-features = false, features = [
    "consensus",
    "eips",
    "network",
    "signer-local",
    "sol-types",
    "serde",
] }
axum = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
k256 = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
