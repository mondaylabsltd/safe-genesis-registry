[package]
name = "genesis-rules"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The rules own the service's vocabulary and every decision it makes. The
# crate is deliberately I/O-free: no HTTP, no storage, no clocks, no runtime.
# Shells (genesis-cf) fetch what a rule asks for and act on what it returns.
[dependencies]
alloy = { version = "2.2.0", default-features = false, features = ["sol-types", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The owner proof: a WebAuthn assertion by a P-256 key (pure Rust, builds for wasm).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# An external owner's approval: secp256k1 recovery, as `ecrecover` (pure Rust, builds for wasm).
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
