# The Safe Genesis Registry service, self-hosted.
#   cp .env.example .env    # then set REGISTRY_ADDRESS (and PRIVATE_KEY to sponsor imports)
#   docker compose up -d
services:
  safe-genesis:
    build: .
    image: safe-genesis-registry:local
    restart: unless-stopped
    # PID 1 forwards SIGTERM; the service drains requests and finishes the
    # submission step it is in (its transaction is persisted before sending).
    init: true
    stop_grace_period: 20s
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - "8080:8080"
    volumes:
      - genesis-data:/data

volumes:
  genesis-data: {}
